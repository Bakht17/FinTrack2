name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Format code with clang-format
        run: |
          find . -name '*.cpp' -o -name '*.h' | xargs clang-format -i

      - name: Check for uncommitted changes (code style violations)
        run: |
          git diff --exit-code

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 python3-pip

      - name: Install aqtinstall (Qt installer)
        run: |
          pip3 install aqtinstall

      - name: List available Qt versions
        run: |
          aqt list-qt linux desktop --arch 6.5.2

      - name: List available modules for Qt 6.5.2
        run: |
          aqt list-qt linux desktop --modules 6.5.2 gcc_64

      - name: Install Qt 6.5.2 with Charts module
        run: |
          aqt install-qt linux desktop 6.5.2 gcc_64 --outputdir $HOME/Qt --modules charts

      - name: Set up Qt environment
        run: echo "$HOME/Qt/6.5.2/gcc_64/bin" >> $GITHUB_PATH

      - name: Configure project with qmake
        run: |
          qmake FinTrack.pro

      - name: Build project
        run: |
          make

      - name: Run tests
        run: |
          ./tests/tst_homewindow.cpp
