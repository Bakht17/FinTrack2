name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang-tidy clang-format bear build-essential

      - name: Install aqtinstall (Qt installer)
        run: |
          pip3 install aqtinstall

      - name: Install Qt 6.5.2 with all modules
        run: |
          aqt install-qt linux desktop 6.5.2 gcc_64 --outputdir $HOME/Qt --modules all

      - name: Set up Qt environment
        run: echo "$HOME/Qt/6.5.2/gcc_64/bin" >> $GITHUB_PATH

      - name: Generate Makefile with qmake
        run: |
          qmake FinTrack.pro

      - name: Generate compilation database
        run: |
          bear -- make

      - name: Run clang-tidy to check code style
        run: |
          find . -name '*.cpp' -o -name '*.h' | xargs clang-tidy --warnings-as-errors=* -- -p .

      - name: Format C++ code with clang-format
        run: |
          find . -name '*.cpp' -o -name '*.h' | xargs clang-format -i

      - name: Check for uncommitted C++ changes (code style violations)
        run: |
          git diff --exit-code

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip libgl1-mesa-dev libglu1-mesa-dev

      - name: Install aqtinstall (Qt installer)
        run: |
          pip3 install aqtinstall

      - name: Install Qt 6.5.2 with all modules
        run: |
          aqt install-qt linux desktop 6.5.2 gcc_64 --outputdir $HOME/Qt --modules all

      - name: Set up Qt environment
        run: echo "$HOME/Qt/6.5.2/gcc_64/bin" >> $GITHUB_PATH

      - name: Configure project with qmake
        run: |
          cd $GITHUB_WORKSPACE
          qmake FinTrack.pro

      - name: Build project
        run: |
          make

      - name: Make test executable
        run: |
          chmod +x ./tests/tst_homewindow
          
      - name: Run tests
        run: |
          ./tests/tst_homewindow
